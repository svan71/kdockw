name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "branding/**"
      - "docs/screenshots/**"
      - "scripts/check_website.py"
      - "scripts/assemble_website.sh"
      - ".gitattributes"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true

      - name: Configure Pages
        uses: actions/configure-pages@v6
        # Pages must be enabled once in repository settings with an admin
        # token; GITHUB_TOKEN cannot create the site. This workflow only reads
        # the existing configuration and deploys the explicitly assembled site.
        with:
          enablement: false

      - name: Assemble site
        shell: bash
        run: bash scripts/assemble_website.sh _site

      - name: Check assembled site and media
        run: python3 scripts/check_website.py _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
